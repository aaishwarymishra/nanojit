[project]
name = "nanojit"
version = "0.1.0"
description = "A tiny ML compiler: traces Python functions into an SSA-style IR."
readme = "README.md"
authors = [
    { name = "blanky", email = "aaishwarymishra@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mlx>=0.32.5",
    "numpy>=2.5.5",
    "pytest>=9.2.0",
    "torch>=2.15.0",
    "triton",
    "triton-msl>=0.3.0",
]
[project.scripts]
nanojit = "nanojit:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ty.environment]
python = ".venv"
root = ["./src"]

[tool.uv]
# Apple-only project (mlx + triton-msl); avoid resolving torch's Linux-only
# triton>=3.9 requirement against the pinned 3.7.0 Metal wheel.
environments = ["sys_platform == 'darwin'"]

[tool.uv.sources]
# triton-msl 0.3.0 targets Triton 3.7.0. Triton publishes no macOS wheel, so use
# the prebuilt cp314/arm64 wheel from the triton-msl release instead of building
# Triton + LLVM from source. This is why the project runs on Python 3.14.
triton = { url = "https://github.com/bledden/triton-msl/releases/download/triton-wheel-3.7.0-cp314-macos-arm64/triton-3.7.0%2Bgit4da2e268-cp314-cp314-macosx_15_0_arm64.whl" }
